name: Deploy static site to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://algo-intern-handbook.pages.dev/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build static site
        shell: bash
        run: |
          mkdir _site
          cp index.html favicon.svg .nojekyll _site/
          cp -R css js _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=algo-intern-handbook --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
